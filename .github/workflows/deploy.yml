name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # Allows manual deploys from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload app via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # The app lives at the repo root and lands flat in the webroot
          local-dir: ./
          # If your FTP account already points directly at public_html,
          # change this to: ./
          server-dir: ./public_html/
          # Never upload anything that doesn't belong in a public webroot.
          # (.htaccess blocks these paths too, as a second line of defence
          # for Hostinger's own Git deployment, which copies everything.)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            setup/**
            database/**
            legacy/**
            docs/**
            README.md
            CLAUDE.md
          # Safety: never let a deploy wipe files it didn't create.
          # db.config.php (generated on the server) is never touched.
          dangerous-clean-slate: false
